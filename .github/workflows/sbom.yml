name: sbom

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.7'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate Go SBOM (reachctl)
        # The repo is a Go workspace (go.work) with local replace directives;
        # cyclonedx-gomod's module-scan modes cannot resolve them ("not a go
        # module" / mangled replace paths). Generate from the real compiled
        # binary instead — same dependency set, verified grounding.
        run: |
          mkdir -p sbom
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          (cd services/runner && go build -o "$RUNNER_TEMP/reachctl" ./cmd/reachctl)
          cyclonedx-gomod bin -json -output sbom/go-reachctl.cdx.json "$RUNNER_TEMP/reachctl"

      - name: Generate Node SBOM (root)
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom/node-root.cdx.json --output-format json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.json
